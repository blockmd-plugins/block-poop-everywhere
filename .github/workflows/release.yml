name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动检查；有新的打包内容且当日未发版时自动递增版本号发版（08:15 由 store-index 自动采集）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish a new patch release even without new package changes"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: plugin-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release-notes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plan version and package plugin
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync, spawn } from 'node:child_process';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const CHINESE_RE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\ufe10-\ufe1f\ufe30-\ufe4f\uff00-\uffef\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const HAN_RE = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const EMOJI_RE = /[©®‼⁉™ℹ↔-↙↩↪⌚-⌛⌨⏏⏩-⏳⏸-⏺Ⓜ▪▫▶◀◻-◾\u2600-\u27bf⤴⤵⬅-⬇⬛⬜⭐⭕〰〽㊗㊙\u20e3\ufe00-\ufe0f\u{1f000}-\u{1faff}]/u;
          const MAX_README_BYTES = 512 * 1024;
          const NOTEBOOK_NAME = '示例笔记本';
          const NOTE_NAME = '示例笔记.md';
          const LAYOUTS = {
            legacy: [],
            full: [
              'checklist', 'form_layout', 'multi_notebook', 'kv_tooltip',
              'sidebar_sections', 'file_badges', 'sidebar_menu', 'backdrops',
              'status_icon', 'toast_icon', 'notes_open', 'log_actions',
              'action_progress', 'panel_toggle', 'editor_insert_mode', 'dialog_token',
            ],
          };

          function requireCond(condition, message) {
            if (!condition) {
              throw new Error(message);
            }
          }

          function checkText(value, locale, context, allowFixture = false) {
            if (typeof value === 'string') {
              let v = value;
              if (allowFixture) {
                v = v
                  .replaceAll(NOTEBOOK_NAME, '')
                  .replaceAll(NOTE_NAME, '')
                  .replaceAll(NOTE_NAME.slice(0, -3), '');
              }
              requireCond(!EMOJI_RE.test(v), `${context}: emoji in ${JSON.stringify(v)}`);
              if (locale.toLowerCase().startsWith('en')) {
                requireCond(!CHINESE_RE.test(v), `${context}: Chinese text in ${JSON.stringify(v)}`);
              }
            } else if (Array.isArray(value)) {
              value.forEach((child, idx) => checkText(child, locale, `${context}[${idx}]`, allowFixture));
            } else if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                checkText(key, 'zh', `${context}.<key>`, false);
                checkText(child, locale, `${context}.${key}`, allowFixture);
              }
            }
          }

          function checkContributesEn(value, context = 'manifest.contributes') {
            if (Array.isArray(value)) {
              value.forEach((child, idx) => checkContributesEn(child, `${context}[${idx}]`));
            } else if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                if (key === 'en') {
                  checkText(child, 'en', `${context}.en`);
                } else {
                  checkContributesEn(child, `${context}.${key}`);
                }
              }
            }
          }

          function declaredSurfaces(manifest) {
            const surfaces = [...(manifest.surfaces || [])];
            const contributes = manifest.contributes || {};
            for (const sec of contributes.settings_sections || []) surfaces.push(`settings_section:${sec.id}`);
            for (const panel of contributes.panels || []) surfaces.push(`panel:${panel.id}`);
            for (const sec of contributes.sidebar_sections || []) surfaces.push(`sidebar_section:${sec.id}`);
            for (const dlg of contributes.dialogs || []) surfaces.push(`dialog:${dlg.id}`);
            return surfaces;
          }

          function stripHtmlComments(text) {
            return text.replace(/<!--[\s\S]*?-->/g, '');
          }

          function checkNoSymlinksTree(rootDir) {
            const stack = [rootDir];
            while (stack.length > 0) {
              const cur = stack.pop();
              for (const entry of fs.readdirSync(cur, { withFileTypes: true })) {
                const full = path.join(cur, entry.name);
                const st = fs.lstatSync(full);
                requireCond(!st.isSymbolicLink(), `Symlink is not allowed in staged package: ${path.relative(rootDir, full)}`);
                if (st.isDirectory()) {
                  stack.push(full);
                }
              }
            }
          }

          function collectFiles(rootDir, exts) {
            const found = [];
            const stack = [rootDir];
            while (stack.length > 0) {
              const cur = stack.pop();
              for (const entry of fs.readdirSync(cur, { withFileTypes: true })) {
                const full = path.join(cur, entry.name);
                if (entry.isDirectory()) {
                  stack.push(full);
                } else if (entry.isFile() && exts.some((ext) => entry.name.endsWith(ext))) {
                  found.push(full);
                }
              }
            }
            return found.sort();
          }

          function readStrictReadme(pkgDir, filename) {
            const filePath = path.join(pkgDir, filename);
            requireCond(fs.existsSync(filePath), `Missing ${filename}`);
            const st = fs.lstatSync(filePath);
            requireCond(!st.isSymbolicLink() && st.isFile(), `${filename} must be a non-symlink regular file`);
            const raw = fs.readFileSync(filePath);
            requireCond(raw.length <= MAX_README_BYTES, `${filename} exceeds ${MAX_README_BYTES} bytes`);
            const decoder = new TextDecoder('utf-8', { fatal: true });
            let text;
            try {
              text = decoder.decode(raw);
            } catch (err) {
              throw new Error(`${filename} must be valid UTF-8: ${err.message}`);
            }
            text = text.replace(/^\ufeff/, '').trim();
            requireCond(Boolean(text), `${filename} must not be empty`);
            return text;
          }

          function resolveEntryScript(pkgDir, manifest) {
            const entry = manifest.entry;
            requireCond(entry && typeof entry === 'object' && !Array.isArray(entry), 'manifest.entry must be an object');
            const jsRel = entry.js;
            requireCond(typeof jsRel === 'string' && jsRel.trim() !== '', 'manifest.entry.js must be a non-empty string');
            requireCond(jsRel === jsRel.trim(), 'manifest.entry.js must not have leading/trailing whitespace');
            requireCond(!jsRel.includes('\0') && !jsRel.includes(':'), `Invalid entry.js: ${jsRel}`);

            const normalized = jsRel.replace(/\\/g, '/');
            requireCond(!normalized.startsWith('/') && !path.isAbsolute(jsRel), `entry.js must not be absolute: ${jsRel}`);
            const rawParts = normalized.split('/').filter((p) => p !== '');
            requireCond(!rawParts.includes('..'), `entry.js must not contain '..': ${jsRel}`);
            requireCond(normalized !== '.' && normalized !== './' && !(rawParts.length === 1 && rawParts[0] === '.'), `entry.js must not be '.': ${jsRel}`);

            const pkgRoot = fs.realpathSync(pkgDir);
            const relParts = rawParts.filter((p) => p !== '.');
            requireCond(relParts.length > 0, `Invalid relative entry.js: ${jsRel}`);
            let cur = pkgDir;
            for (let i = 0; i < relParts.length - 1; i += 1) {
              cur = path.join(cur, relParts[i]);
              requireCond(fs.existsSync(cur) && !fs.lstatSync(cur).isSymbolicLink() && fs.statSync(cur).isDirectory(), `entry.js parent missing or symlink: ${jsRel}`);
            }
            const target = path.join(cur, relParts[relParts.length - 1]);
            requireCond(fs.existsSync(target) && !fs.lstatSync(target).isSymbolicLink() && fs.statSync(target).isFile(), `entry.js must be a regular file: ${jsRel}`);
            const resolved = fs.realpathSync(target);
            requireCond(resolved.startsWith(pkgRoot + path.sep), `entry.js escapes dist package: ${jsRel}`);
            return resolved;
          }

          function* iterControls(value) {
            if (Array.isArray(value)) {
              for (const child of value) yield* iterControls(child);
            } else if (value && typeof value === 'object') {
              const kind = value.kind;
              if (kind === 'segmented' || kind === 'select' || kind === 'switch') {
                const choices = kind === 'switch' ? [false, true] : value.options.map((o) => o.value);
                yield [value.id, value.value, choices];
              }
              for (const child of Object.values(value)) yield* iterControls(child);
            }
          }

          async function checkRenders(rpc, locale, surface) {
            const initial = (await rpc('plugin.render', { surface, values: {} })).page;
            checkText(initial, locale, `${locale} ${surface} initial`, true);
            const rendered = [...iterControls(initial)];
            const base = Object.fromEntries(rendered.map(([k, cur]) => [k, cur]));
            let count = 1;
            for (const [k, cur, choices] of rendered) {
              for (const choice of choices) {
                if (choice === cur) continue;
                const page = (await rpc('plugin.render', { surface, values: { ...base, [k]: choice } })).page;
                checkText(page, locale, `${locale} ${surface} ${k}=${choice}`, true);
                count += 1;
              }
            }
            return count;
          }

          function createMockSDKFiles(tempDir) {
            const sdkCode = `
          import fs from 'node:fs';

          let seq = 1000;
          const inboundQueue = [];
          const waitBuf = new Int32Array(new SharedArrayBuffer(4));
          let stdinCarry = Buffer.alloc(0);

          export class HostRPCError extends Error {
            constructor(code, message) {
              super(message);
              this.name = 'HostRPCError';
              this.code = code;
            }
          }

          export function log(...args) {
            const line = args.map((v) => (typeof v === 'string' ? v : JSON.stringify(v))).join(' ');
            fs.writeSync(2, line + '\\n');
          }

          export function send(obj) {
            fs.writeSync(1, JSON.stringify(obj) + '\\n');
          }

          export function notifyHost(method, params = {}) {
            send({ jsonrpc: '2.0', method, params: params ?? {} });
          }

          function readMessageLine() {
            const chunk = Buffer.alloc(4096);
            while (true) {
              const nlIdx = stdinCarry.indexOf(10);
              if (nlIdx !== -1) {
                const lineBuf = stdinCarry.subarray(0, nlIdx);
                stdinCarry = stdinCarry.subarray(nlIdx + 1);
                const trimmed = lineBuf.toString('utf8').trim();
                if (!trimmed) continue;
                try {
                  const msg = JSON.parse(trimmed);
                  if (msg && typeof msg === 'object' && !Array.isArray(msg)) return msg;
                } catch {}
                continue;
              }
              let n = 0;
              try {
                n = fs.readSync(0, chunk, 0, chunk.length, null);
              } catch (err) {
                if (err && err.code === 'EAGAIN') {
                  Atomics.wait(waitBuf, 0, 0, 1);
                  continue;
                }
                throw err;
              }
              if (n === 0) {
                if (stdinCarry.length > 0) {
                  const tail = stdinCarry.toString('utf8').trim();
                  stdinCarry = Buffer.alloc(0);
                  if (tail) {
                    try {
                      const msg = JSON.parse(tail);
                      if (msg && typeof msg === 'object' && !Array.isArray(msg)) return msg;
                    } catch {}
                  }
                }
                return null;
              }
              stdinCarry = Buffer.concat([stdinCarry, chunk.subarray(0, n)]);
            }
          }

          export function callHost(method, params = {}) {
            seq += 1;
            const reqId = \`p-\${seq}\`;
            send({ jsonrpc: '2.0', id: reqId, method, params: params ?? {} });
            while (true) {
              const msg = readMessageLine();
              if (msg === null) throw new Error('stdin closed while awaiting host response');
              const isResponse = msg.id !== undefined && msg.id !== null && String(msg.id) === reqId && !msg.method && ('result' in msg || 'error' in msg);
              if (isResponse) {
                if (msg.error) {
                  throw new HostRPCError(typeof msg.error.code === 'number' ? msg.error.code : -32000, msg.error.message || 'host error');
                }
                return msg.result ?? {};
              }
              inboundQueue.push(msg);
            }
          }

          export function serve(handler) {
            while (true) {
              const req = inboundQueue.length > 0 ? inboundQueue.shift() : readMessageLine();
              if (req === null) break;
              const method = req.method;
              if (typeof method !== 'string' || !method) continue;
              const reqId = req.id;
              const params = req.params && typeof req.params === 'object' && !Array.isArray(req.params) ? req.params : {};
              try {
                const result = handler(method, params, req);
                if (reqId !== undefined && reqId !== null) {
                  send({ jsonrpc: '2.0', id: reqId, result: result === undefined ? null : result });
                }
                if (method === 'plugin.shutdown') break;
              } catch (err) {
                if (reqId !== undefined && reqId !== null) {
                  const message = err && err.message ? String(err.message) : String(err);
                  const code = err && typeof err.code === 'number' ? err.code : -32000;
                  send({ jsonrpc: '2.0', id: reqId, error: { code, message } });
                }
                if (method === 'plugin.shutdown') break;
              }
            }
          }
          `;
            const loaderCode = `
          export async function resolve(specifier, context, nextResolve) {
            if (specifier === '/runtime/block-sdk.js') {
              return { shortCircuit: true, url: new URL('./mock-sdk.mjs', import.meta.url).href };
            }
            return nextResolve(specifier, context);
          }
          `;
            const registerCode = `
          import { register } from 'node:module';
          register(new URL('./mock-loader.mjs', import.meta.url));
          `;
            fs.writeFileSync(path.join(tempDir, 'mock-sdk.mjs'), sdkCode, 'utf8');
            fs.writeFileSync(path.join(tempDir, 'mock-loader.mjs'), loaderCode, 'utf8');
            fs.writeFileSync(path.join(tempDir, 'mock-register.mjs'), registerCode, 'utf8');
            return path.join(tempDir, 'mock-register.mjs');
          }

          async function runPlugin({ entryScript, registerPath, pkgDir, locale, layout, capabilities, root, surfaces, commands, actions }) {
            const notebook = path.join(root, NOTEBOOK_NAME);
            const downloads = path.join(root, 'Downloads');
            const dataDir = path.join(root, 'Data');
            const archiveCustom = path.join(root, 'ArchiveCustom');
            fs.mkdirSync(notebook, { recursive: true });
            fs.mkdirSync(downloads, { recursive: true });
            fs.mkdirSync(dataDir, { recursive: true });
            fs.mkdirSync(archiveCustom, { recursive: true });

            const protectedSamples = [
              '> [poop:classic] user example <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] bq fence <!-- block-poop-everywhere:drop -->',
              '  > [poop:classic] list fence <!-- block-poop-everywhere:drop -->',
              ' \t> [poop:classic] tab indented <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] html block <!-- block-poop-everywhere:drop -->',
              'LineBefore\u2028> [poop:classic] ls sep <!-- block-poop-everywhere:drop -->',
              '>   > [poop:classic] bq list fence <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] bq tab fence <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] custom html7 <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] heading html7 <!-- block-poop-everywhere:drop -->',
              '>     > [poop:classic] bq heading indented <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] nested lazy cont <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] multiline code span <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] nested lazy bare cont <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] code span lazy cont <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] code span ord2 <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] refdef list2 <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] nested ord2 lazy <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] bq list lazy <!-- block-poop-everywhere:drop -->',
              '> [poop:classic] nested bq list lazy <!-- block-poop-everywhere:drop -->',
              '> example \\<!-- block-poop-everywhere:drop -->',
            ];

            const notes = {
              [NOTE_NAME]: (
                '# Demo\n\n' +
                `~~~md\n${protectedSamples[0]}\n~~~\n\n` +
                `> \`\`\`md\n${protectedSamples[1]}\n> \`\`\`\n\n` +
                `- \`\`\`md\n${protectedSamples[2]}\n  \`\`\`\n\n` +
                `${protectedSamples[3]}\n\n` +
                `<pre>\n${protectedSamples[4]}\n</pre>\n\n` +
                `${protectedSamples[5]}\n\n` +
                `> - \`\`\`md\n${protectedSamples[6]}\n>   \`\`\`\n\n` +
                `>\t \`\`\`md\n${protectedSamples[7]}\n> \`\`\`\n\n` +
                `<custom>\n${protectedSamples[8]}\n\n` +
                `# HeadingBeforeCustom\n<custom>\n${protectedSamples[9]}\n\n` +
                `> # HeadingInsideBQ\n${protectedSamples[10]}\n\n` +
                `> > nested paragraph\n${protectedSamples[11]}\n\n` +
                `> example \`start\n${protectedSamples[12]}\n> end\`\n\n` +
                `> > nested bare\nlazy bare line\n${protectedSamples[13]}\n\n` +
                `> span \`open\nlazy line inside span\n${protectedSamples[14]}\n> close\`\n\n` +
                `> span \`open2\n> 2. not a list\n${protectedSamples[15]}\n> close2\`\n\n` +
                `[r]: /url\n2. item\n   ${protectedSamples[16]}\n\n` +
                `> > A\n> > 2. x\n${protectedSamples[17]}\n\n` +
                `> - A\n${protectedSamples[18]}\n\n` +
                `> > - A\n${protectedSamples[19]}\n\n` +
                `${protectedSamples[20]}\n\n` +
                'Hello Block.\n'
              ),
              'BOMFence.md': '\ufeff```md\n> [poop:classic] bom fence <!-- block-poop-everywhere:drop -->\n```\n',
              ' A.md': '# Leading Space Note\n',
              'A.md': '# Normal Note\n',
              'Notes.MD': '# Uppercase Extension\n',
              'Extra.markdown': '# Markdown Extension\n',
              'NoEOL.md': 'A',
              'OnlyLF.md': '\n',
              'MixedEOL.md': 'A\n\r\n',
              'LegacyWrap1.md': '> [poop:wrap-start] cap <!-- block-poop-everywhere:drop -->\n\nA\n\n> [poop:wrap-end] ··· <!-- block-poop-everywhere:drop -->',
              'LegacyWrap2.md': '> [poop:wrap-start] cap <!-- block-poop-everywhere:drop -->\n>\n> A\n>\n\n> [poop:wrap-end] ··· <!-- block-poop-everywhere:drop -->',
              'WrapTarget.md': 'Intro\n\nfirst\n\nsecond\n\nOutro\n',
            };

            const storage = layout === 'legacy' ? { config: { bg_enabled: false } } : {};
            const backdropState = {
              enabled: layout === 'legacy',
              id: 'poop-wallpaper',
              pattern: 'scatter',
              density: 'medium',
              opacity: 0.1,
              tint: 'accent',
              dark_glow: false,
            };
            const badgesState = {};
            const statusState = {};
            const titlebarState = {};
            const panelState = { open: false };
            const dialogMode = { state: 'ok', seq: 0, token: '' };
            const activeNoteState = { path: NOTE_NAME };
            const activeSelection = { note: 'WrapTarget.md', text: 'first\n\nsecond' };
            const toasts = [];
            const openedNotes = [];
            const fsOps = [];
            const cryptoOps = [];

            const noteRev = (text) => crypto.createHash('sha256').update(text, 'utf8').digest('hex');

            function handleHost(method, params) {
              if (method === 'host.storage.get') {
                const k = params.key;
                return { found: Object.prototype.hasOwnProperty.call(storage, k), value: storage[k] };
              }
              if (method === 'host.storage.set') {
                storage[params.key] = params.value;
                return { ok: true };
              }
              if (method === 'host.notebooks.list') {
                return { notebooks: [{ path: notebook, name: NOTEBOOK_NAME, active: true }] };
              }
              if (method === 'host.notes.list') {
                return {
                  notes: Object.keys(notes).sort().map((p) => ({
                    path: p,
                    title: path.basename(p, path.extname(p)),
                  })),
                };
              }
              if (method === 'host.notes.read') {
                const p = params.path;
                requireCond(Object.prototype.hasOwnProperty.call(notes, p), `host.notes.read unknown path: ${p}`);
                const content = notes[p];
                return { content, revision: noteRev(content), dirty: false };
              }
              if (method === 'host.notes.write') {
                const p = params.path;
                const exp = params.expected_revision;
                if (exp && Object.prototype.hasOwnProperty.call(notes, p) && noteRev(notes[p]) !== exp) {
                  return { __rpc_error__: { code: -32006, message: 'revision conflict' } };
                }
                notes[p] = params.content;
                return { ok: true, revision: noteRev(notes[p]) };
              }
              if (method === 'host.notes.active') {
                const cur = activeNoteState.path;
                if (!cur) return { active: false, path: '', title: '', notebook_root: notebook };
                return { active: true, path: cur, title: path.basename(cur, path.extname(cur)), notebook_root: notebook };
              }
              if (method === 'host.notes.open') {
                openedNotes.push([params.notebook_root || '', params.path]);
                return { ok: true };
              }
              if (method === 'host.editor.selection') {
                return { note: activeSelection.note, text: activeSelection.text, has_selection: Boolean(activeSelection.text) };
              }
              if (method === 'host.editor.insert') {
                const target = params.note || NOTE_NAME;
                const text = params.text || '';
                const mode = params.mode || 'replace';
                const cur = notes[target] || '';
                const sel = activeSelection.note === target ? activeSelection.text : '';
                if (sel && cur.includes(sel)) {
                  if (mode === 'replace') {
                    notes[target] = cur.replace(sel, text);
                  } else {
                    const idx = cur.indexOf(sel) + sel.length;
                    notes[target] = cur.slice(0, idx) + text + cur.slice(idx);
                  }
                } else {
                  notes[target] = cur + text;
                }
                return { ok: true, path: target };
              }
              if (method === 'host.titlebar.set_button') {
                titlebarState[params.id || ''] = params;
                return { ok: true };
              }
              if (method === 'host.status.set') {
                statusState[params.id || ''] = params;
                return { ok: true };
              }
              if (method === 'host.sidebar.set_badges') {
                requireCond('badge_id' in params, 'host.sidebar.set_badges requires badge_id');
                requireCond(Object.keys(params.entries || {}).length <= 512, 'host.sidebar.set_badges exceeded 512 entries');
                if (params.clear) {
                  for (const k of Object.keys(badgesState)) delete badgesState[k];
                } else {
                  if (!params.patch) {
                    for (const k of Object.keys(badgesState)) delete badgesState[k];
                  }
                  for (const [rel, ent] of Object.entries(params.entries || {})) {
                    if (ent === null) delete badgesState[rel];
                    else badgesState[rel] = ent;
                  }
                }
                return { ok: true, count: Object.keys(badgesState).length };
              }
              if (method === 'host.sidebar.get_badges') {
                return { entries: { ...badgesState } };
              }
              if (method === 'host.ui.backdrop') {
                return { ...backdropState };
              }
              if (method === 'host.ui.set_backdrop') {
                for (const [k, v] of Object.entries(params)) {
                  if (v !== null && v !== undefined) backdropState[k] = v;
                }
                return { ...backdropState };
              }
              if (method === 'host.ui.toast') {
                checkText(params.message || '', locale, `${locale} toast`, true);
                toasts.push(params);
                return { ok: true, shown: true };
              }
              if (method === 'host.ui.toggle_panel') {
                panelState.open = !panelState.open;
                return { ok: true, open: panelState.open };
              }
              if (method === 'host.ui.open_panel') {
                panelState.open = true;
                return { ok: true };
              }
              if (method === 'host.ui.close_panel') {
                panelState.open = false;
                return { ok: true };
              }
              if (method === 'host.ui.open_dialog') {
                if (dialogMode.state === 'error') {
                  return { __rpc_error__: { code: -32601, message: 'dialog unavailable' } };
                }
                if (dialogMode.state === 'false') {
                  return { ok: false };
                }
                dialogMode.seq += 1;
                dialogMode.token = `dlg-${dialogMode.seq}`;
                return { ok: true, dialog_token: dialogMode.token };
              }
              if (['host.ui.open_settings', 'host.ui.close_dialog', 'host.ui.refresh', 'host.action.progress'].includes(method)) {
                return { ok: true };
              }
              if (method === 'host.perf.snapshot') {
                return { rss_bytes: 42 * 1024 * 1024, note_count: Object.keys(notes).length };
              }
              if (method === 'host.fs.stat') {
                fsOps.push(['stat', params]);
                const p = String(params.path || '');
                if (!fs.existsSync(p)) {
                  return { exists: false, is_dir: false };
                }
                const st = fs.statSync(p);
                return { exists: true, is_dir: st.isDirectory(), is_file: st.isFile(), size: st.size };
              }
              if (method === 'host.fs.mkdir') {
                fsOps.push(['mkdir', params]);
                fs.mkdirSync(params.path, { recursive: true });
                return { ok: true };
              }
              if (method === 'host.fs.write') {
                fsOps.push(['write', params]);
                requireCond(params.atomic === true, 'host.fs.write expected atomic: true');
                requireCond(params.mkdir_parents === true, 'host.fs.write expected mkdir_parents: true');
                fs.mkdirSync(path.dirname(params.path), { recursive: true });
                fs.writeFileSync(params.path, params.content, 'utf8');
                return { ok: true, bytes: Buffer.byteLength(params.content, 'utf8') };
              }
              if (method === 'host.crypto.hash') {
                cryptoOps.push(params);
                requireCond(params.algorithm === 'sha256', `unexpected hash algorithm: ${params.algorithm}`);
                const hex = crypto.createHash('sha256').update(String(params.text || ''), 'utf8').digest('hex');
                return { hex };
              }
              throw new Error(`Unexpected host request: ${method}`);
            }

            const proc = spawn(process.execPath, ['--import', registerPath, entryScript], {
              cwd: pkgDir,
              stdio: ['pipe', 'pipe', 'pipe'],
            });

            let stdoutCarry = '';
            const lineQueue = [];
            let lineWaiters = [];
            let stderrBuf = '';
            proc.stderr.on('data', (d) => { stderrBuf += d.toString('utf8'); });
            proc.stdout.on('data', (chunk) => {
              stdoutCarry += chunk.toString('utf8');
              while (true) {
                const idx = stdoutCarry.indexOf('\n');
                if (idx === -1) break;
                const line = stdoutCarry.slice(0, idx);
                stdoutCarry = stdoutCarry.slice(idx + 1);
                if (lineWaiters.length > 0) {
                  const resolve = lineWaiters.shift();
                  resolve(line);
                } else {
                  lineQueue.push(line);
                }
              }
            });
            const exitPromise = new Promise((resolve) => {
              proc.on('close', (code) => {
                while (lineWaiters.length > 0) {
                  lineWaiters.shift()(null);
                }
                resolve(code);
              });
            });

            function nextLine(timeoutMs = 10000) {
              if (lineQueue.length > 0) return Promise.resolve(lineQueue.shift());
              return new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                  lineWaiters = lineWaiters.filter((w) => w !== onLine);
                  reject(new Error(`${locale}/${layout}: timed out reading stdout (stderr=${stderrBuf})`));
                }, timeoutMs);
                function onLine(val) {
                  clearTimeout(timer);
                  resolve(val);
                }
                lineWaiters.push(onLine);
              });
            }

            function sendMsg(msg) {
              proc.stdin.write(JSON.stringify({ jsonrpc: '2.0', ...msg }) + '\n');
            }

            let requestId = 0;
            async function rpc(method, params = {}) {
              requestId += 1;
              const myId = requestId;
              sendMsg({ id: myId, method, params });
              while (true) {
                const line = await nextLine();
                requireCond(line !== null, `${locale}/${layout}: plugin exited during ${method} (stderr=${stderrBuf})`);
                const message = JSON.parse(line);
                requireCond(message.jsonrpc === '2.0', `${method}: invalid jsonrpc`);
                if ('method' in message) {
                  const result = handleHost(message.method, message.params || {});
                  if ('id' in message && message.id !== undefined && message.id !== null) {
                    if (result && typeof result === 'object' && '__rpc_error__' in result) {
                      sendMsg({ id: message.id, error: result.__rpc_error__ });
                    } else {
                      sendMsg({ id: message.id, result });
                    }
                  }
                  continue;
                }
                requireCond(message.id === myId, `${method}: unexpected response id ${message.id}`);
                requireCond(!('error' in message), `${method}: ${JSON.stringify(message.error)}`);
                return message.result;
              }
            }

            try {
              const init = await rpc('plugin.initialize', {
                locale,
                data_dir: dataDir,
                downloads_dir: downloads,
                notebook_root: notebook,
                ui_capabilities: capabilities,
                theme: 'light',
                tarot: false,
              });
              requireCond(init.ready === true, `${locale}/${layout}: ready !== true`);
              requireCond(backdropState.enabled === (layout !== 'legacy'), `${locale}/${layout}: backdrop mismatch`);

              const pagesBySurface = {};
              for (const surface of surfaces) {
                const initial = (await rpc('plugin.render', { surface })).page;
                checkText(initial, locale, `${locale}/${layout} ${surface} initial`, true);
                requireCond(typeof initial.title === 'string' && initial.title.trim(), `${surface}: missing title`);
                pagesBySurface[surface] = initial;
                const count = await checkRenders(rpc, locale, surface);
                console.log(`${locale}/${layout} ${surface}: ${count} renders passed`);
              }

              if (actions) {
                await rpc('plugin.render', { surface: 'settings_page', values: { bg_enabled: false } });
                requireCond(backdropState.enabled === false && storage.config.bg_enabled === false, `${locale}: bg_enabled=false failed`);
                await rpc('plugin.render', { surface: 'settings_page', values: { bg_enabled: true } });
                requireCond(backdropState.enabled === true && backdropState.density === 'medium', `${locale}: bg_enabled=true failed`);

                for (const cmd of commands) {
                  if (cmd.id === 'open_flush_dialog') continue;
                  const res = await rpc('plugin.command', { command_id: cmd.id, context: { note: NOTE_NAME, source: 'palette' } });
                  checkText(res, locale, `${locale} command ${cmd.id}`, true);
                }

                const resNd = await rpc('plugin.command', { command_id: 'drop_here', context: { note: 'WrapTarget.md', source: 'palette' } });
                requireCond(resNd.ok === true && notes['WrapTarget.md'].includes('first\n\nsecond'), `${locale}: drop_here overwrote selection`);

                await rpc('plugin.command', { command_id: 'flush_note', context: { note: 'WrapTarget.md', source: 'sidebar_menu' } });
                const beforeWrap = notes['WrapTarget.md'];
                const resWrap = await rpc('plugin.command', {
                  command_id: 'poopify_selection',
                  context: { note: 'WrapTarget.md', selection: 'first\n\nsecond', source: 'editor_menu' },
                });
                requireCond(resWrap.ok === true && notes['WrapTarget.md'].includes('block-poop-everywhere:drop:wrap-start') && notes['WrapTarget.md'].includes('block-poop-everywhere:drop:wrap-end'), `${locale}: wrap failed`);
                requireCond(!notes['WrapTarget.md'].includes('[poop:'), `${locale}: raw [poop: leaked`);
                const resUnwrap = await rpc('plugin.command', { command_id: 'flush_note', context: { note: 'WrapTarget.md', source: 'sidebar_menu' } });
                requireCond(resUnwrap.ok === true && notes['WrapTarget.md'] === beforeWrap, `${locale}: wrap round-trip mismatch`);

                notes['A.md'] = '# Normal Note\n\n> [poop:classic] legacy drop <!-- block-poop-everywhere:drop -->\n';
                const resLeg = await rpc('plugin.command', { command_id: 'flush_note', context: { note: 'A.md', source: 'sidebar_menu' } });
                requireCond(resLeg.ok === true && !notes['A.md'].includes('block-poop-everywhere:drop') && notes['A.md'] === '# Normal Note\n\n', `${locale}: legacy drop flush failed`);

                const resSpace = await rpc('plugin.command', { command_id: 'drop_in_note', context: { note: ' A.md', source: 'sidebar_menu' } });
                requireCond(resSpace.ok === true && notes[' A.md'].includes('block-poop-everywhere:drop') && !notes['A.md'].includes('block-poop-everywhere:drop'), `${locale}: leading space note mismatch`);
                const resEmpty = await rpc('plugin.command', { command_id: 'drop_in_note', context: { note: '', source: 'sidebar_menu' } });
                requireCond(resEmpty.ok === false, `${locale}: empty sidebar_menu target must not fall back`);

                for (const extNote of ['Notes.MD', 'Extra.markdown']) {
                  const rExt = await rpc('plugin.command', { command_id: 'drop_in_note', context: { note: extNote, source: 'sidebar_menu' } });
                  requireCond(rExt.ok === true, `${locale}: drop failed on ${extNote}`);
                }
                const panelPage = (await rpc('plugin.render', { surface: 'panel:poop-board' })).page;
                const byTitle = Object.fromEntries(panelPage.cards[1].items[0].entries.map((e) => [e.title, e]));
                for (const extNote of ['Notes.MD', 'Extra.markdown']) {
                  const aid = byTitle[extNote]?.action_id || '';
                  requireCond(aid.startsWith('open_target:') && aid.length === 28, `${locale}: invalid action_id for ${extNote}: ${aid}`);
                }
                requireCond(cryptoOps.length > 0, `${locale}: expected host.crypto.hash to be called`);

                for (const evParams of [
                  { event: 'note.saved', path: NOTE_NAME, notebook_root: notebook },
                  { event: 'note.opened', path: NOTE_NAME },
                  { event: 'theme.changed', theme: 'dark' },
                  { event: 'theme.changed', tarot: true },
                  { event: 'theme.changed', tarot: false },
                  { event: 'locale.changed', locale },
                ]) {
                  await rpc('plugin.event', evParams);
                }

                const badExport = await rpc('plugin.action', {
                  action_id: 'export_guide',
                  surface: 'settings_page',
                  values: { archive_dir: path.join(root, 'does-not-exist') },
                });
                requireCond(badExport.ok === false, `${locale}: invalid archive_dir must fail`);

                const customExport = await rpc('plugin.action', {
                  action_id: 'export_guide',
                  surface: 'settings_page',
                  values: { archive_dir: archiveCustom },
                });
                requireCond(customExport.ok === true && fs.existsSync(customExport.reveal_path), `${locale}: custom archive_dir export failed`);

                await rpc('plugin.action', { action_id: 'save_prefs', surface: 'settings_page', values: { archive_dir: '' } });

                for (const [actId, surf] of [
                  ['drop_now', 'settings_page'],
                  ['rescan_notes', 'settings_page'],
                  ['demo_toasts', 'settings_page'],
                  ['export_guide', 'settings_page'],
                  ['sidebar_drop', 'sidebar_section:today-drops'],
                  ['panel_drop', 'panel:poop-board'],
                ]) {
                  const res = await rpc('plugin.action', { action_id: actId, surface: surf, values: {} });
                  requireCond(res.ok === true, `${locale}: action ${actId} failed: ${JSON.stringify(res)}`);
                  checkText(res, locale, `${locale} action ${actId}`, true);
                  if (actId === 'export_guide') {
                    requireCond(fs.existsSync(res.reveal_path), `${locale}: exported guide file missing on disk`);
                    checkText(fs.readFileSync(res.reveal_path, 'utf8'), locale, `${locale} exported guide`, true);
                  }
                }
                requireCond(fsOps.some(([op]) => op === 'mkdir') && fsOps.some(([op]) => op === 'write') && fsOps.some(([op]) => op === 'stat'), `${locale}: expected host.fs.mkdir/write/stat calls`);

                const sbPage = (await rpc('plugin.render', { surface: 'sidebar_section:today-drops' })).page;
                const logEntries = sbPage.cards[0].items[0].entries;
                requireCond(logEntries.length > 0 && logEntries[0].action_id.startsWith('open_target:'), `${locale}: sidebar missing open_target`);
                const openRes = await rpc('plugin.action', { action_id: logEntries[0].action_id, surface: 'sidebar_section:today-drops', values: {} });
                requireCond(openRes.ok === true && openedNotes.length > 0, `${locale}: open_target failed`);

                await rpc('plugin.render', { surface: 'dialog:flush-confirm' });
                const staleRes = await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'dialog:flush-confirm', values: {} });
                requireCond(staleRes.ok === false, `${locale}: pure render must not authorize flush`);

                for (const badMode of ['error', 'false']) {
                  dialogMode.state = badMode;
                  const abortRes = await rpc('plugin.action', { action_id: 'open_flush', surface: 'settings_page', values: {} });
                  dialogMode.state = 'ok';
                  requireCond(abortRes.ok === false, `${locale}: open_flush must fail for ${badMode}`);
                  const rejRes = await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'dialog:flush-confirm', values: {} });
                  requireCond(rejRes.ok === false, `${locale}: confirm must reject after ${badMode}`);
                }

                activeNoteState.path = '';
                const noActiveFlush = await rpc('plugin.action', { action_id: 'panel_flush_page', surface: 'panel:poop-board', values: {} });
                activeNoteState.path = NOTE_NAME;
                requireCond(noActiveFlush.ok === false && notes[' A.md'].includes('block-poop-everywhere:drop'), `${locale}: panel_flush_page touched wrong note`);

                for (const sp of ['NoEOL.md', 'OnlyLF.md', 'MixedEOL.md']) {
                  const spDrop = await rpc('plugin.command', { command_id: 'drop_in_note', context: { source: 'sidebar_menu', note: sp } });
                  requireCond(spDrop.ok === true, `${locale}: ${sp} drop failed`);
                }

                for (const badSel of ['\nA\r', 'A\n\n\n\nB', '> A\n\n> B', '> A\nlazy', '> A\nlazy\n\n> B']) {
                  const bw = notes['WrapTarget.md'];
                  const badWrap = await rpc('plugin.command', { command_id: 'poopify_selection', context: { source: 'editor_menu', note: 'WrapTarget.md', selection: badSel } });
                  requireCond(badWrap.ok === false && notes['WrapTarget.md'] === bw, `${locale}: unsafe selection mutated note`);
                }

                for (const badCap of ['# Heading', '- bullet', 'foo\\', 'foo `tick']) {
                  await rpc('plugin.action', { action_id: 'save_prefs', surface: 'settings_page', values: { caption: badCap } });
                  const cd = await rpc('plugin.command', { command_id: 'drop_in_note', context: { source: 'sidebar_menu', note: 'A.md' } });
                  requireCond(cd.ok === true, `${locale}: cap drop failed for ${badCap}`);
                  const cf = await rpc('plugin.command', { command_id: 'flush_note', context: { source: 'sidebar_menu', note: 'A.md' } });
                  requireCond(cf.ok === true && !notes['A.md'].includes('block-poop-everywhere:drop'), `${locale}: cap flush failed for ${badCap}`);
                }
                await rpc('plugin.action', { action_id: 'save_prefs', surface: 'settings_page', values: { caption: '' } });

                const d1 = await rpc('plugin.command', { command_id: 'open_flush_dialog', context: { source: 'palette' } });
                requireCond(d1.ok === true, `${locale}: open_flush_dialog #1 failed`);
                const tok1 = dialogMode.token;
                const d2 = await rpc('plugin.command', { command_id: 'open_flush_dialog', context: { source: 'palette' } });
                requireCond(d2.ok === true, `${locale}: open_flush_dialog #2 failed`);
                const tok2 = dialogMode.token;
                requireCond(tok1 !== tok2, `${locale}: expected fresh token`);
                requireCond((await rpc('plugin.action', { action_id: 'dialog_keep', surface: 'dialog:flush-confirm', values: {}, dialog_token: tok1 })).ok === false, 'stale keep must fail');
                requireCond((await rpc('plugin.action', { action_id: 'dialog_keep', surface: 'panel:poop-board', values: {}, dialog_token: tok2 })).ok === false, 'wrong surface keep must fail');
                requireCond((await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'dialog:flush-confirm', values: {}, dialog_token: tok1 })).ok === false, 'stale confirm must fail');
                requireCond((await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'dialog:flush-confirm', values: {}, dialog_token: ` ${tok2} ` })).ok === false, 'padded token must fail');
                requireCond((await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'dialog:flush-confirm', values: {} })).ok === false, 'missing token must fail');
                requireCond((await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'panel:poop-board', values: {}, dialog_token: tok2 })).ok === false, 'wrong surface confirm must fail');
                const flushRes = await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'dialog:flush-confirm', values: {}, dialog_token: tok2 });
                requireCond(flushRes.ok === true && backdropState.enabled === true && storage.config.bg_enabled === true, `${locale}: flush failed or changed backdrop`);
                requireCond((await rpc('plugin.action', { action_id: 'dialog_flush_confirm', surface: 'dialog:flush-confirm', values: {}, dialog_token: tok2 })).ok === false, 'replay must fail');

                for (const sample of protectedSamples) {
                  requireCond(notes[NOTE_NAME].includes(sample), `${locale}: protected sample corrupted: ${sample}`);
                }
                requireCond(notes['NoEOL.md'] === 'A', 'NoEOL.md mismatch');
                requireCond(notes['OnlyLF.md'] === '\n', 'OnlyLF.md mismatch');
                requireCond(notes['MixedEOL.md'] === 'A\n\r\n', 'MixedEOL.md mismatch');
                requireCond(notes['LegacyWrap1.md'] === '\nA\n', 'LegacyWrap1.md mismatch');
                requireCond(notes['LegacyWrap2.md'] === '>\n> A\n>\n', 'LegacyWrap2.md mismatch');
                requireCond(notes['BOMFence.md'].includes('bom fence'), 'BOMFence.md mismatch');
                requireCond(!notes[' A.md'].includes('block-poop-everywhere:drop') && !notes['Notes.MD'].includes('block-poop-everywhere:drop'), 'top-level markers left behind');

                requestId += 1;
                const cmdReqId = requestId;
                sendMsg({ id: cmdReqId, method: 'plugin.action', params: { action_id: 'rescan_notes', surface: 'settings_page', values: {} } });
                requestId += 1;
                const shutReqId = requestId;
                let interleavedSent = false;
                let gotCmd = false;
                let gotShut = false;
                while (!(gotCmd && gotShut)) {
                  const line = await nextLine();
                  requireCond(line !== null, `${locale}: premature exit during interleaved shutdown`);
                  const msg = JSON.parse(line);
                  if ('method' in msg) {
                    if (!interleavedSent) {
                      sendMsg({ id: shutReqId, method: 'plugin.shutdown', params: {} });
                      interleavedSent = true;
                    }
                    const result = handleHost(msg.method, msg.params || {});
                    if ('id' in msg && msg.id !== undefined && msg.id !== null) {
                      sendMsg({ id: msg.id, result });
                    }
                    continue;
                  }
                  if (msg.id === cmdReqId) {
                    requireCond(!msg.error && msg.result.ok === true, `${locale}: interleaved rescan failed`);
                    gotCmd = true;
                  } else if (msg.id === shutReqId) {
                    requireCond(!msg.error && msg.result.ok === true, `${locale}: interleaved shutdown failed`);
                    gotShut = true;
                  }
                }
                requireCond(interleavedSent, `${locale}: rescan did not issue host RPC`);
                const exitCode = await exitPromise;
                requireCond(exitCode === 0, `${locale}: exitCode=${exitCode}`);
                return pagesBySurface;
              }

              const shut = await rpc('plugin.shutdown');
              requireCond(shut.ok === true, `${locale}/${layout}: shutdown failed`);
              const exitCode = await exitPromise;
              requireCond(exitCode === 0, `${locale}/${layout}: exitCode=${exitCode}`);
              return pagesBySurface;
            } finally {
              if (proc.exitCode === null) proc.kill();
            }
          }

          async function validateStagedPackage(pkgDir) {
            checkNoSymlinksTree(pkgDir);
            const pyFiles = collectFiles(pkgDir, ['.py']);
            requireCond(pyFiles.length === 0, `Python files are no longer allowed in staged package: ${pyFiles.join(', ')}`);

            const jsFiles = collectFiles(pkgDir, ['.js', '.mjs']);
            requireCond(jsFiles.length > 0, 'No JS files found in staged package');
            for (const jsFile of jsFiles) {
              execFileSync(process.execPath, ['--check', jsFile], { stdio: 'inherit' });
            }

            const mdMod = await import(pathToFileURL(path.join(pkgDir, 'markdown.js')).href);
            const t0 = performance.now();
            const bigLines = mdMod.splitMdLines('hello line\n'.repeat(160000));
            const dt0 = performance.now() - t0;
            requireCond(bigLines.length === 160000 && dt0 < 2000, `splitMdLines performance regression: ${dt0.toFixed(2)}ms`);

            const sig = '<!-- block-poop-everywhere:drop -->';
            requireCond(mdMod.countMarkers(`> > [r]: /u\n> example ${sig}\n`) === 0, 'nested refdef lazy cont must be protected');
            requireCond(mdMod.countMarkers(`> - <div>\n> drop ${sig}\n`) === 1, 'bq-list HTML block must close on dedent');
            requireCond(mdMod.countMarkers(`> [x](/url "caption\n> example ${sig}\n> tail")\n`) === 0, 'inline link title must be protected');
            const lw3 = `> [poop:wrap-start] cap ${sig}\n> - A\n> [poop:wrap-end] ··· ${sig}\n\n`;
            requireCond(mdMod.countMarkers(lw3) === 2, 'legacy v1.0.2 list wrap count mismatch');
            const lw3Out = mdMod.stripMarkers(lw3);
            requireCond(lw3Out.removed === 2 && lw3Out.content === '> - A\n', `legacy v1.0.2 list wrap flush mismatch: ${JSON.stringify(lw3Out)}`);
            requireCond(!mdMod.isEditorWrapSafe('> > A\n> B'), 'nested lazy bq depth drop must be refused');
            const t1 = performance.now();
            requireCond(mdMod.countMarkers('> [x]: /url\n'.repeat(2000)) === 0, 'bq refdef batch count mismatch');
            requireCond(performance.now() - t1 < 1000, 'bq refdef parsing regressed to O(N^2)');

            const manifestPath = path.join(pkgDir, 'manifest.json');
            requireCond(fs.existsSync(manifestPath) && !fs.lstatSync(manifestPath).isSymbolicLink() && fs.statSync(manifestPath).isFile(), 'Staged package missing manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const pluginId = manifest.id;
            requireCond(typeof pluginId === 'string' && pluginId.trim(), 'Missing manifest.id');
            requireCond(pluginId.trim() !== 'block-diagnostics', 'Reserved plugin id: block-diagnostics');

            for (const field of ['name', 'summary']) {
              const translations = manifest[field];
              requireCond(translations && typeof translations === 'object' && !Array.isArray(translations), `manifest.${field} must be an object`);
              for (const loc of ['zh', 'en']) {
                const value = translations[loc];
                requireCond(typeof value === 'string' && value.trim(), `Missing manifest.${field}.${loc}`);
                if (loc === 'en') {
                  requireCond(!CHINESE_RE.test(value), `manifest.${field}.en: Chinese text in ${JSON.stringify(value)}`);
                }
              }
            }
            requireCond(Array.isArray(manifest.permissions) && manifest.permissions.includes('system:fs'), 'manifest.permissions must include system:fs');
            for (const perm of manifest.permissions) {
              const reason = manifest.permission_reasons?.[perm];
              requireCond(reason && typeof reason.zh === 'string' && reason.zh.trim() && typeof reason.en === 'string' && reason.en.trim(), `Missing permission_reasons for ${perm}`);
              requireCond([...reason.zh].length <= 80, `permission_reasons.${perm}.zh exceeds 80 chars`);
              requireCond([...reason.en].length <= 140, `permission_reasons.${perm}.en exceeds 140 chars`);
            }
            const bd = manifest.contributes?.block_decorators?.[0];
            requireCond(bd && bd.id === 'poop-drop' && bd.default_callout === 'warning', 'manifest.contributes.block_decorators[0] invalid');
            requireCond(bd.empty_placeholder?.zh && bd.empty_placeholder?.en, 'block_decorators missing empty_placeholder');

            checkText(manifest, 'zh', 'manifest');
            checkContributesEn(manifest.contributes);
            checkContributesEn(manifest.permission_reasons, 'manifest.permission_reasons');

            const zhReadme = readStrictReadme(pkgDir, 'README.md');
            const enReadme = readStrictReadme(pkgDir, 'README.en.md');
            requireCond(HAN_RE.test(stripHtmlComments(zhReadme)), 'README.md must contain visible Chinese text');
            requireCond(!CHINESE_RE.test(enReadme), 'README.en.md must contain English-only text');
            requireCond(/[A-Za-z]/.test(stripHtmlComments(enReadme)), 'README.en.md must contain at least one visible ASCII letter');
            checkText(zhReadme, 'zh', 'README.md');
            checkText(enReadme, 'en', 'README.en.md');
            requireCond(zhReadme !== enReadme, 'The two README files must differ');

            const surfaces = declaredSurfaces(manifest);
            const commands = (manifest.contributes || {}).commands || [];
            const entryScript = resolveEntryScript(pkgDir, manifest);

            const sdkTmp = fs.mkdtempSync(path.join(os.tmpdir(), 'block-poop-sdk-'));
            try {
              const registerPath = createMockSDKFiles(sdkTmp);
              const cases = [];
              for (const [layout, capabilities] of Object.entries(LAYOUTS)) {
                for (const locale of ['zh', 'en']) {
                  cases.push({ layout, capabilities, locale });
                }
              }
              const results = await Promise.all(cases.map(async ({ layout, capabilities, locale }) => {
                const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'block-poop-i18n-'));
                try {
                  const pages = await runPlugin({
                    entryScript,
                    registerPath,
                    pkgDir,
                    locale,
                    layout,
                    capabilities,
                    root: temp,
                    surfaces,
                    commands,
                    actions: layout === 'full',
                  });
                  return [`${layout}:${locale}`, pages];
                } finally {
                  fs.rmSync(temp, { recursive: true, force: true });
                }
              }));
              const pagesByCase = Object.fromEntries(results);
              for (const layout of Object.keys(LAYOUTS)) {
                for (const surface of surfaces) {
                  requireCond(
                    pagesByCase[`${layout}:zh`][surface].title !== pagesByCase[`${layout}:en`][surface].title,
                    `${layout} ${surface}: Chinese and English page titles must differ`
                  );
                  requireCond(
                    JSON.stringify(pagesByCase[`${layout}:zh`][surface]) !== JSON.stringify(pagesByCase[`${layout}:en`][surface]),
                    `${layout} ${surface}: Chinese and English rendered pages must differ`
                  );
                }
              }
            } finally {
              fs.rmSync(sdkTmp, { recursive: true, force: true });
            }
            console.log('Bilingual release gate passed on staged dist package.');
          }

          function sh(cmd, args) {
            return execFileSync(cmd, args, { encoding: 'utf8' }).trim();
          }

          function shCall(cmd, args) {
            try {
              execFileSync(cmd, args, { stdio: 'ignore' });
              return true;
            } catch {
              return false;
            }
          }

          function summary(msg) {
            console.log(msg);
            const sPath = process.env.GITHUB_STEP_SUMMARY;
            if (sPath) {
              fs.appendFileSync(sPath, `${msg}\n`, 'utf8');
            }
          }

          function setOutput(kv) {
            const oPath = process.env.GITHUB_OUTPUT;
            if (oPath) {
              const lines = Object.entries(kv).map(([k, v]) => `${k}=${v}`).join('\n') + '\n';
              fs.appendFileSync(oPath, lines, 'utf8');
            }
          }

          function parseVer(tag) {
            const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(String(tag || '').trim());
            return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
          }

          function cmpVer(a, b) {
            return (a[0] - b[0]) || (a[1] - b[1]) || (a[2] - b[2]);
          }

          function shanghaiDate(date) {
            return new Intl.DateTimeFormat('sv-SE', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).format(date);
          }

          const repo = process.env.REPO;
          const event = process.env.EVENT_NAME;
          const refName = process.env.REF_NAME;
          const force = process.env.FORCE === 'true';

          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          requireCond(manifest.app === 'blockmd', "manifest.app must be 'blockmd'");
          const pluginId = manifest.id.trim();
          requireCond(/^[a-z0-9][a-z0-9-]{1,47}$/.test(pluginId), `invalid id: ${pluginId}`);
          const baseVer = manifest.version.trim();
          const mBase = /^(\d+)\.(\d+)\.(\d+)$/.exec(baseVer);
          requireCond(Boolean(mBase), `manifest.version must be X.Y.Z, got ${baseVer}`);
          const baseMajor = Number(mBase[1]);
          const baseMinor = Number(mBase[2]);
          const pluginTitle = (manifest.name?.en || pluginId).trim();

          const headSha = sh('git', ['rev-parse', 'HEAD']);

          const releases = [];
          let pageNum = 1;
          while (true) {
            const page = JSON.parse(sh('gh', ['api', `repos/${repo}/releases?per_page=100&page=${pageNum}`]));
            if (!Array.isArray(page) || page.length === 0) break;
            releases.push(...page);
            if (page.length < 100) break;
            pageNum += 1;
          }
          const stable = releases
            .filter((r) => !r.draft && !r.prerelease && parseVer(r.tag_name))
            .sort((a, b) => cmpVer(parseVer(a.tag_name), parseVer(b.tag_name)));
          const previous = stable.length > 0 ? stable[stable.length - 1] : null;

          const taken = new Map();
          const addTaken = (pv) => {
            if (pv) taken.set(pv.join('.'), pv);
          };
          for (const r of releases) addTaken(parseVer(r.tag_name));
          for (const t of sh('git', ['tag', '--list', 'v*']).split(/\r?\n/)) {
            addTaken(parseVer(t));
          }

          function resolveTagSha(rel) {
            if (!rel) return '';
            const tag = rel.tag_name;
            try {
              const s = sh('git', ['rev-parse', `${tag}^{commit}`]);
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            try {
              const s = sh('gh', ['api', `repos/${repo}/commits/${tag}`, '--jq', '.sha']);
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            return '';
          }

          let version;
          let tag;
          let prevSha = '';

          if (event === 'push' && refName.startsWith('v')) {
            const pv = parseVer(refName);
            requireCond(Boolean(pv), `Tag ${refName} must match vX.Y.Z`);
            version = `${pv[0]}.${pv[1]}.${pv[2]}`;
            tag = `v${version}`;
            const prevForNotes = [...stable].reverse().find((r) => r.tag_name !== tag) || null;
            prevSha = resolveTagSha(prevForNotes);
          } else {
            if (event === 'schedule' && !force && previous && previous.published_at) {
              const today = shanghaiDate(new Date());
              const pubDay = shanghaiDate(new Date(previous.published_at));
              if (today === pubDay) {
                summary(`今日（${today}）已发布过 ${previous.tag_name}，每日定时最多自动发布一次，本次跳过。`);
                setOutput({ should_release: 'no' });
                process.exit(0);
              }
            }

            prevSha = resolveTagSha(previous);
            if (prevSha && prevSha === headSha && !force) {
              summary(`当前 HEAD (${headSha.slice(0, 7)}) 与最新 Release ${previous.tag_name} 一致，跳过发版。`);
              setOutput({ should_release: 'no' });
              process.exit(0);
            }

            if (prevSha && !force) {
              const isAnc = shCall('git', ['merge-base', '--is-ancestor', prevSha, headSha]);
              if (isAnc) {
                const changed = sh('git', ['diff', '--name-only', prevSha, headSha])
                  .split(/\r?\n/)
                  .filter((p) => p && !p.startsWith('.github/') && p !== '.gitignore' && p !== 'LICENSE');
                if (changed.length === 0) {
                  summary(`自 ${previous.tag_name} 以来仅包含 CI 或仓库元数据变更，无需发包，本次跳过。`);
                  setOutput({ should_release: 'no' });
                  process.exit(0);
                }
                const subjects = sh('git', ['log', '--no-merges', '--format=%s', `${prevSha}..${headSha}`])
                  .split(/\r?\n/)
                  .filter(Boolean);
                if (subjects.length > 0 && subjects.every((s) => s.toLowerCase().includes('[skip release]'))) {
                  summary('区间内提交均标记 [skip release]，本次跳过。');
                  setOutput({ should_release: 'no' });
                  process.exit(0);
                }
              }
            }

            const commitCount = Number(sh('git', ['rev-list', '--count', headSha]));
            let cand = [baseMajor, baseMinor, commitCount];
            const allTaken = [...taken.values()].sort(cmpVer);
            const highest = allTaken.length > 0 ? allTaken[allTaken.length - 1] : null;
            if (highest && cmpVer(cand, highest) <= 0) {
              cand = [highest[0], highest[1], highest[2] + 1];
            }
            while (taken.has(cand.join('.'))) {
              cand = [cand[0], cand[1], cand[2] + 1];
            }
            version = `${cand[0]}.${cand[1]}.${cand[2]}`;
            tag = `v${version}`;
          }

          const notesLines = [];
          if (prevSha && prevSha !== headSha && shCall('git', ['merge-base', '--is-ancestor', prevSha, headSha])) {
            const rawLog = sh('git', ['log', '--no-merges', '--reverse', '--format=%h%x00%s', `${prevSha}..${headSha}`]);
            for (const line of rawLog.split(/\r?\n/)) {
              if (!line.trim()) continue;
              const nul = line.indexOf('\0');
              if (nul < 0) continue;
              const cSha = line.slice(0, nul);
              const subj = line.slice(nul + 1);
              if (/^(?:ci|docs)(?:\([^)]*\))?:\s/i.test(subj)) continue;
              notesLines.push(`- ${subj} (\`${cSha}\`)`);
            }
          }
          if (notesLines.length === 0) {
            notesLines.push(`- Automated release from \`${headSha.slice(0, 7)}\`.`);
          }
          fs.writeFileSync('release-notes.md', `## Changes\n\n${notesLines.join('\n')}\n`, 'utf8');

          const pkgDir = path.join('dist', pluginId);
          fs.rmSync('dist', { recursive: true, force: true });
          fs.mkdirSync(pkgDir, { recursive: true });
          const tarBytes = execFileSync('git', ['archive', '--format=tar', headSha]);
          execFileSync('tar', ['-xf', '-', '-C', pkgDir], { input: tarBytes });
          fs.rmSync(path.join(pkgDir, '.github'), { recursive: true, force: true });
          for (const metaFile of ['.gitignore']) {
            const p = path.join(pkgDir, metaFile);
            if (fs.existsSync(p) && !fs.lstatSync(p).isSymbolicLink()) {
              fs.rmSync(p);
            }
          }

          try {
            checkNoSymlinksTree(pkgDir);
          } catch (err) {
            console.error(`Bilingual release gate failed: ${err.message}`);
            process.exit(1);
          }

          manifest.version = version;
          fs.writeFileSync(path.join(pkgDir, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n', 'utf8');

          try {
            await validateStagedPackage(pkgDir);
          } catch (err) {
            console.error(`Bilingual release gate failed: ${err.stack || err.message}`);
            process.exit(1);
          }

          const archiveName = `${pluginId}-${tag}.tar.gz`;
          execFileSync('tar', ['-czf', archiveName, '-C', 'dist', pluginId], { stdio: 'inherit' });

          summary(`准备发布 ${pluginTitle} ${tag} (archive=${archiveName}, commit=${headSha.slice(0, 7)})`);
          setOutput({
            should_release: 'yes',
            version,
            tag,
            title: `${pluginTitle} ${version}`,
            archive: archiveName,
            head_sha: headSha,
          });
          JS

      # 更新说明只经 tailnet 用 Magpie：Mac 在线先用 Mac 的 agy-cli/gemini-3.8-flash，再 VPS gpt-6-luna，最后 deepseek-flash。
      # 与 Block 主仓 scripts/release/release-notes.mjs 的顺序保持一致；不要用 Google AI Studio key。
      - name: Join tailnet
        id: tailscale
        if: steps.plan.outputs.should_release == 'yes'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-release-notes
          version: "1.104.4"
          ping: "100.115.90.80"
          timeout: 1m
          retry: "2"
          args: --shields-up

      - name: Write release notes with AI
        if: steps.plan.outputs.should_release == 'yes'
        env:
          TAILNET: ${{ steps.tailscale.outcome }}
        run: |
          reach() { timeout "$3" bash -c "echo >/dev/tcp/$1/$2" 2>/dev/null && echo yes || echo no; }
          if [ "$TAILNET" = "success" ]; then
            export MAGPIE_REACHABLE=$(reach 100.115.90.80 3425 10)
            export MAC_MAGPIE_REACHABLE=$(reach 100.118.27.43 3425 8)
          else
            export MAGPIE_REACHABLE=no MAC_MAGPIE_REACHABLE=no
          fi
          node .github/scripts/release-notes.mjs release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          ARCHIVE: ${{ steps.plan.outputs.archive }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Release ${TAG} already exists. Never overwrite a published archive (SHA-256 immutability); bump version instead." >&2
            exit 1
          else
            gh release create "${TAG}" "${ARCHIVE}" \
              --target "${HEAD_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
