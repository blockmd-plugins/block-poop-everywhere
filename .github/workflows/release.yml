name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动检查；有新的打包内容且当日未发版时自动递增版本号发版（08:15 由 store-index 自动采集）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish a new patch release even without new package changes"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan version and package plugin
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          from collections import deque
          from concurrent.futures import ThreadPoolExecutor
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          from queue import Empty, Queue
          import re
          import shutil
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          from threading import Thread

          CHINESE = re.compile(
              r"[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff"
              r"\ufe10-\ufe1f\ufe30-\ufe4f\uff00-\uffef"
              r"\U00020000-\U0002ffff\U00030000-\U000323af]"
          )
          HAN = re.compile(
              r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff"
              r"\U00020000-\U0002ffff\U00030000-\U000323af]"
          )
          EMOJI = re.compile(
              r"[©®‼⁉™ℹ↔-↙↩↪⌚-⌛⌨⏏⏩-⏳⏸-⏺Ⓜ▪▫▶◀◻-◾"
              r"\u2600-\u27bf⤴⤵⬅-⬇⬛⬜⭐⭕〰〽㊗㊙"
              r"\u20e3\ufe00-\ufe0f\U0001f000-\U0001faff]"
          )
          MAX_README_BYTES = 512 * 1024
          NOTEBOOK_NAME = "示例笔记本"
          NOTE_NAME = "示例笔记.md"
          LAYOUTS = {
              "legacy": [],
              "full": [
                  "checklist", "form_layout", "multi_notebook", "kv_tooltip",
                  "sidebar_sections", "file_badges", "sidebar_menu", "backdrops",
                  "status_icon", "toast_icon", "notes_open", "log_actions",
                  "action_progress", "panel_toggle",
              ],
          }

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def check_text(value, locale, context, *, allow_fixture=False):
              if isinstance(value, str):
                  if allow_fixture:
                      value = value.replace(NOTEBOOK_NAME, "").replace(NOTE_NAME, "").replace(NOTE_NAME[:-3], "")
                  require(not EMOJI.search(value), f"{context}: emoji in {value!r}")
                  if locale.lower().startswith("en"):
                      require(not CHINESE.search(value), f"{context}: Chinese text in {value!r}")
              elif isinstance(value, dict):
                  for key, child in value.items():
                      check_text(key, "zh", f"{context}.<key>", allow_fixture=False)
                      check_text(child, locale, f"{context}.{key}", allow_fixture=allow_fixture)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      check_text(child, locale, f"{context}[{index}]", allow_fixture=allow_fixture)

          def check_contributes_en(value, context="manifest.contributes"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "en":
                          check_text(child, "en", f"{context}.en")
                      else:
                          check_contributes_en(child, f"{context}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      check_contributes_en(child, f"{context}[{index}]")

          def declared_surfaces(manifest):
              surfaces = list(manifest.get("surfaces") or [])
              contributes = manifest.get("contributes") or {}
              for sec in contributes.get("settings_sections") or []:
                  surfaces.append(f"settings_section:{sec['id']}")
              for panel in contributes.get("panels") or []:
                  surfaces.append(f"panel:{panel['id']}")
              for sec in contributes.get("sidebar_sections") or []:
                  surfaces.append(f"sidebar_section:{sec['id']}")
              for dialog in contributes.get("dialogs") or []:
                  surfaces.append(f"dialog:{dialog['id']}")
              require(surfaces, "manifest must declare at least one surface")
              return list(dict.fromkeys(surfaces))

          def check_no_symlinks_tree(pkg_dir):
              require(not os.path.islink(pkg_dir) and pkg_dir.is_dir(), f"Release package dir must be a non-symlink directory: {pkg_dir}")
              for root_dir, dir_names, file_names in os.walk(pkg_dir, followlinks=False):
                  for name in dir_names + file_names:
                      full_path = os.path.join(root_dir, name)
                      require(
                          not os.path.islink(full_path),
                          f"Symlink is not allowed in release package: {os.path.relpath(full_path, pkg_dir)}",
                      )

          def strip_html_comments(text):
              text = re.sub(r"<!--.*?-->", "", text, flags=re.S)
              text = re.sub(r"<!--.*$", "", text, flags=re.S)
              return text.strip()

          def read_strict_readme(pkg_dir, filename):
              path = pkg_dir / filename
              p = str(path)
              require(not os.path.islink(p) and os.path.isfile(p), f"{filename} must be a non-symlink regular file")
              raw = path.read_bytes()
              require(len(raw) <= MAX_README_BYTES, f"{filename} exceeds {MAX_README_BYTES} bytes")
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise ValueError(f"{filename} must be valid UTF-8: {exc}") from None
              text = text.lstrip("\ufeff").strip()
              require(bool(text), f"{filename} must not be empty")
              return text

          def resolve_entry_command(pkg_dir, manifest):
              entry = manifest.get("entry")
              require(isinstance(entry, dict), "manifest.entry must be an object")
              raw_cmd = entry.get("command")
              require(isinstance(raw_cmd, list) and len(raw_cmd) > 0, "manifest.entry.command must be a non-empty array")
              for idx, part in enumerate(raw_cmd):
                  require(isinstance(part, str), f"manifest.entry.command[{idx}] must be a string")
              cmd0 = raw_cmd[0]
              require(cmd0.strip() != "", "manifest.entry.command[0] must not be empty")
              require(cmd0 == cmd0.strip(), "manifest.entry.command[0] must not have leading/trailing whitespace")
              require("\x00" not in cmd0 and ":" not in cmd0, f"Invalid entry.command[0]: {cmd0!r}")

              normalized = cmd0.replace("\\", "/")
              require(not normalized.startswith("/") and not os.path.isabs(cmd0), f"entry.command[0] must not be an absolute path: {cmd0!r}")
              raw_parts = [p for p in normalized.split("/") if p != ""]
              require(".." not in raw_parts, f"entry.command[0] must not contain '..': {cmd0!r}")
              require(normalized not in (".", "./") and raw_parts != ["."], f"entry.command[0] must not be '.': {cmd0!r}")

              if "/" in normalized or normalized.startswith("."):
                  pkg_root = pkg_dir.resolve()
                  rel_parts = [p for p in raw_parts if p != "."]
                  require(bool(rel_parts), f"Invalid relative entry.command[0]: {cmd0!r}")
                  cur = pkg_dir
                  for part in rel_parts[:-1]:
                      cur = cur / part
                      require(not os.path.islink(cur) and cur.is_dir(), f"entry.command[0] parent missing or symlink: {cmd0!r}")
                  target = cur / rel_parts[-1]
                  require(not os.path.islink(target) and target.is_file(), f"entry.command[0] must be a non-symlink regular file in dist package: {cmd0!r}")
                  resolved = target.resolve()
                  require(resolved.is_relative_to(pkg_root) and resolved != pkg_root, f"entry.command[0] escapes dist package: {cmd0!r}")
                  resolved_cmd0 = str(resolved)
              else:
                  found = shutil.which(cmd0)
                  require(found is not None, f"entry.command[0] is not a valid PATH command: {cmd0!r}")
                  resolved_cmd0 = found

              return [resolved_cmd0, *raw_cmd[1:]]

          def controls(value):
              if isinstance(value, dict):
                  kind = value.get("kind")
                  if kind in ("segmented", "select", "switch"):
                      choices = [False, True] if kind == "switch" else [
                          opt["value"] for opt in value["options"]
                      ]
                      yield value["id"], value["value"], choices
                  for child in value.values():
                      yield from controls(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from controls(child)

          def check_renders(rpc, locale, surface):
              initial = rpc("plugin.render", {"surface": surface, "values": {}})["page"]
              check_text(initial, locale, f"{locale} {surface} initial", allow_fixture=True)
              rendered = list(controls(initial))
              base = {key: current for key, current, _ in rendered}
              count = 1
              for key, current, choices in rendered:
                  for choice in choices:
                      if choice == current:
                          continue
                      variant = {**base, key: choice}
                      page = rpc("plugin.render", {"surface": surface, "values": variant})["page"]
                      check_text(page, locale, f"{locale} {surface} {key}={choice}", allow_fixture=True)
                      count += 1
              return count

          def run_plugin(entry, pkg_dir, locale, layout, capabilities, root, surfaces, commands, actions=False):
              notebook = root / NOTEBOOK_NAME
              downloads = root / "Downloads"
              data_dir = root / "Data"
              for directory in (notebook, downloads, data_dir):
                  directory.mkdir()
              notes = {
                  NOTE_NAME: "# Demo\n\n~~~md\n> [poop:classic] user example\n~~~\n\nHello Block.\n",
                  " A.md": "# Leading Space Note\n",
                  "A.md": "# Normal Note\n",
              }
              storage = {}
              backdrop_state = {
                  "enabled": False,
                  "id": "poop-wallpaper",
                  "pattern": "scatter",
                  "density": "medium",
                  "opacity": 0.10,
                  "tint": "accent",
                  "dark_glow": False,
              }
              badges_state = {}
              status_state = {}
              titlebar_state = {}
              panel_state = {"open": False}
              dialog_disabled = {"flag": False}
              toasts = []
              opened_notes = []

              def note_rev(text):
                  return hashlib.sha256(text.encode("utf-8")).hexdigest()

              def host(method, params):
                  if method == "host.storage.get":
                      key = params["key"]
                      return {"found": key in storage, "value": storage.get(key)}
                  if method == "host.storage.set":
                      storage[params["key"]] = params["value"]
                      return {"ok": True}
                  if method == "host.notebooks.list":
                      return {"notebooks": [{"path": str(notebook), "name": NOTEBOOK_NAME, "active": True}]}
                  if method == "host.notes.list":
                      return {"notes": [{"path": p, "title": p[:-3]} for p in sorted(notes)]}
                  if method == "host.notes.read":
                      p = params["path"]
                      require(p in notes, f"host.notes.read unknown path: {p!r}")
                      content = notes[p]
                      return {"content": content, "revision": note_rev(content), "dirty": False}
                  if method == "host.notes.write":
                      p = params["path"]
                      exp = params.get("expected_revision")
                      if exp and p in notes and note_rev(notes[p]) != exp:
                          return {"__rpc_error__": {"code": -32006, "message": "revision conflict"}}
                      notes[p] = params["content"]
                      return {"ok": True, "revision": note_rev(notes[p])}
                  if method == "host.notes.active":
                      return {"active": True, "path": NOTE_NAME, "title": NOTE_NAME[:-3], "notebook_root": str(notebook)}
                  if method == "host.notes.open":
                      opened_notes.append((params.get("notebook_root", ""), params["path"]))
                      return {"ok": True}
                  if method == "host.editor.selection":
                      return {"note": NOTE_NAME, "text": "Hello", "has_selection": True}
                  if method == "host.editor.insert":
                      target = params.get("note") or NOTE_NAME
                      text = params.get("text", "")
                      notes[target] = notes.get(target, "") + "\n" + text + "\n"
                      return {"ok": True, "path": target}
                  if method == "host.titlebar.set_button":
                      titlebar_state[params.get("id", "")] = params
                      return {"ok": True}
                  if method == "host.status.set":
                      status_state[params.get("id", "")] = params
                      return {"ok": True}
                  if method == "host.sidebar.set_badges":
                      require("badge_id" in params, "host.sidebar.set_badges requires badge_id")
                      if params.get("clear"):
                          badges_state.clear()
                      else:
                          if not params.get("patch"):
                              badges_state.clear()
                          for rel, ent in (params.get("entries") or {}).items():
                              if ent is None:
                                  badges_state.pop(rel, None)
                              else:
                                  badges_state[rel] = ent
                      return {"ok": True, "count": len(badges_state)}
                  if method == "host.sidebar.get_badges":
                      return {"entries": dict(badges_state)}
                  if method == "host.ui.backdrop":
                      return dict(backdrop_state)
                  if method == "host.ui.set_backdrop":
                      backdrop_state.update({k: v for k, v in params.items() if v is not None})
                      return dict(backdrop_state)
                  if method == "host.ui.toast":
                      check_text(params.get("message", ""), locale, f"{locale} toast", allow_fixture=True)
                      toasts.append(params)
                      return {"ok": True}
                  if method == "host.ui.toggle_panel":
                      panel_state["open"] = not panel_state["open"]
                      return {"ok": True, "open": panel_state["open"]}
                  if method == "host.ui.open_panel":
                      panel_state["open"] = True
                      return {"ok": True}
                  if method == "host.ui.close_panel":
                      panel_state["open"] = False
                      return {"ok": True}
                  if method == "host.ui.open_dialog":
                      if dialog_disabled["flag"]:
                          return {"__rpc_error__": {"code": -32601, "message": "dialog unavailable"}}
                      return {"ok": True}
                  if method in ("host.ui.open_settings", "host.ui.close_dialog", "host.ui.refresh", "host.action.progress"):
                      return {"ok": True}
                  if method == "host.perf.snapshot":
                      return {"rss_bytes": 42 * 1024 * 1024, "note_count": len(notes)}
                  raise ValueError(f"Unexpected host request: {method}")

              env = {k: os.environ[k] for k in ("PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "LC_CTYPE", "SYSTEMROOT", "COMSPEC") if k in os.environ}
              env.update({"PYTHONDONTWRITEBYTECODE": "1", "PYTHONUNBUFFERED": "1"})
              process = subprocess.Popen(
                  entry, cwd=pkg_dir, env=env, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                  text=True, encoding="utf-8",
              )
              replies = Queue()

              def read_replies():
                  for line in process.stdout:
                      replies.put(line)
                  replies.put(None)

              reader = Thread(target=read_replies, daemon=True)
              reader.start()
              request_id = 0

              def send(message):
                  process.stdin.write(json.dumps({"jsonrpc": "2.0", **message}) + "\n")
                  process.stdin.flush()

              def rpc(method, params=None):
                  nonlocal request_id
                  request_id += 1
                  send({"id": request_id, "method": method, "params": params or {}})
                  while True:
                      try:
                          line = replies.get(timeout=10)
                      except Empty:
                          raise ValueError(f"{locale}/{layout}: timed out during {method}") from None
                      require(line is not None, f"{locale}/{layout}: plugin exited during {method}")
                      message = json.loads(line)
                      require(message.get("jsonrpc") == "2.0", f"{method}: invalid JSON-RPC version")
                      if "method" in message:
                          result = host(message["method"], message.get("params", {}))
                          if "id" in message:
                              if isinstance(result, dict) and "__rpc_error__" in result:
                                  send({"id": message["id"], "error": result["__rpc_error__"]})
                              else:
                                  send({"id": message["id"], "result": result})
                          continue
                      require(message.get("id") == request_id, f"{method}: unexpected response id")
                      require("error" not in message, f"{method}: {message.get('error')}")
                      return message["result"]

              try:
                  init = rpc("plugin.initialize", {
                      "locale": locale, "data_dir": str(data_dir), "downloads_dir": str(downloads),
                      "notebook_root": str(notebook), "ui_capabilities": capabilities,
                  })
                  require(init.get("ready") is True, f"{locale}/{layout}: plugin is not ready")
                  pages_by_surface = {}
                  for surface in surfaces:
                      initial = rpc("plugin.render", {"surface": surface})["page"]
                      check_text(initial, locale, f"{locale}/{layout} {surface} initial page", allow_fixture=True)
                      title = initial.get("title")
                      require(isinstance(title, str) and title.strip(), f"{locale}/{layout} {surface}: missing page title")
                      pages_by_surface[surface] = initial
                      count = check_renders(rpc, locale, surface)
                      print(f"{locale}/{layout} {surface}: {count} renders passed")
                  if actions:
                      for cmd in commands:
                          res = rpc("plugin.command", {"command_id": cmd["id"], "context": {"note": NOTE_NAME, "source": "palette"}})
                          check_text(res, locale, f"{locale} command {cmd['id']}", allow_fixture=True)
                      # Regression: sidebar_menu preserves leading space and never touches wrong note or falls back.
                      res_space = rpc("plugin.command", {"command_id": "drop_in_note", "context": {"note": " A.md", "source": "sidebar_menu"}})
                      require(res_space.get("ok") is True, f"{locale}: sidebar drop on ' A.md' failed")
                      require("block-poop-everywhere:drop" in notes[" A.md"] and "block-poop-everywhere:drop" not in notes["A.md"],
                              f"{locale}: sidebar_menu wrote wrong note")
                      res_empty = rpc("plugin.command", {"command_id": "drop_in_note", "context": {"note": "", "source": "sidebar_menu"}})
                      require(res_empty.get("ok") is False, f"{locale}: empty sidebar_menu target must not fall back")
                      for ev_params in (
                          {"event": "note.saved", "path": NOTE_NAME, "notebook_root": str(notebook)},
                          {"event": "note.opened", "path": NOTE_NAME},
                          {"event": "theme.changed", "theme": "dark"},
                          {"event": "locale.changed", "locale": locale},
                      ):
                          rpc("plugin.event", ev_params)
                      for act_id, surface in (
                          ("drop_now", "settings_page"),
                          ("rescan_notes", "settings_page"),
                          ("demo_toasts", "settings_page"),
                          ("export_guide", "settings_page"),
                          ("apply_backdrop", "settings_section:poop-appearance"),
                          ("sidebar_drop", "sidebar_section:today-drops"),
                          ("panel_drop", "panel:poop-board"),
                      ):
                          res = rpc("plugin.action", {"action_id": act_id, "surface": surface, "values": {}})
                          require(res.get("ok") is True, f"{locale} action {act_id}: expected ok=True, got {res}")
                          check_text(res, locale, f"{locale} action {act_id}", allow_fixture=True)
                      # Regression: clicking rendered log_list action opens bound notebook+note.
                      sb_page = rpc("plugin.render", {"surface": "sidebar_section:today-drops"})["page"]
                      log_entries = sb_page["cards"][0]["items"][0]["entries"]
                      require(log_entries and log_entries[0].get("action_id", "").startswith("open_target:"),
                              f"{locale}: sidebar drop list missing open_target action_id")
                      open_res = rpc("plugin.action", {"action_id": log_entries[0]["action_id"], "surface": "sidebar_section:today-drops", "values": {}})
                      require(open_res.get("ok") is True and opened_notes, f"{locale}: open_target did not invoke host.notes.open")
                      # Regression: unavailable dialog must NEVER silently flush notes.
                      dialog_disabled["flag"] = True
                      abort_res = rpc("plugin.action", {"action_id": "open_flush", "surface": "settings_page", "values": {}})
                      dialog_disabled["flag"] = False
                      require(abort_res.get("ok") is False, f"{locale}: open_flush must fail when dialog unavailable")
                      require("block-poop-everywhere:drop" in notes[" A.md"], f"{locale}: open_flush deleted notes without dialog")
                      # Render flush dialog to mint confirmation token, then confirm flush.
                      rpc("plugin.render", {"surface": "dialog:flush-confirm"})
                      flush_res = rpc("plugin.action", {"action_id": "dialog_flush_confirm", "surface": "dialog:flush-confirm", "values": {}})
                      require(flush_res.get("ok") is True, f"{locale} dialog_flush_confirm failed: {flush_res}")
                      require("> [poop:classic] user example" in notes[NOTE_NAME], f"{locale}: flush deleted user code fence line")
                      require("block-poop-everywhere:drop" not in notes[NOTE_NAME] and "block-poop-everywhere:drop" not in notes[" A.md"],
                              f"{locale}: flush left plugin markers behind")
                  require(rpc("plugin.shutdown").get("ok") is True, f"{locale}/{layout}: shutdown failed")
                  require(process.wait(timeout=10) == 0, f"{locale}/{layout}: plugin exited unsuccessfully")
                  return pages_by_surface
              finally:
                  if process.poll() is None:
                      process.kill()
                      process.wait()
                  reader.join(timeout=1)
                  process.stdin.close()
                  process.stdout.close()

          def validate_staged_package(pkg_dir):
              check_no_symlinks_tree(pkg_dir)
              for py_path in sorted(pkg_dir.rglob("*.py")):
                  if py_path.is_file():
                      compile(py_path.read_bytes(), str(py_path), "exec")

              manifest_path = pkg_dir / "manifest.json"
              require(not os.path.islink(manifest_path) and manifest_path.is_file(), "Staged package missing manifest.json")
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              plugin_id = manifest.get("id")
              require(isinstance(plugin_id, str) and plugin_id.strip(), "Missing manifest.id")
              require(plugin_id.strip() != "block-diagnostics", "Reserved plugin id: block-diagnostics")

              for field in ("name", "summary"):
                  translations = manifest.get(field)
                  require(isinstance(translations, dict), f"manifest.{field} must be an object")
                  for locale in ("zh", "en"):
                      value = translations.get(locale)
                      require(isinstance(value, str) and value.strip(), f"Missing manifest.{field}.{locale}")
                      if locale == "en":
                          require(not CHINESE.search(value), f"manifest.{field}.en: Chinese text in {value!r}")
              check_text(manifest, "zh", "manifest")
              check_contributes_en(manifest.get("contributes"))
              check_contributes_en(manifest.get("permission_reasons"), "manifest.permission_reasons")

              zh_readme = read_strict_readme(pkg_dir, "README.md")
              en_readme = read_strict_readme(pkg_dir, "README.en.md")
              require(HAN.search(strip_html_comments(zh_readme)), "README.md must contain visible Chinese text")
              require(not CHINESE.search(en_readme), "README.en.md must contain English-only text")
              require(re.search(r"[A-Za-z]", strip_html_comments(en_readme)), "README.en.md must contain at least one visible ASCII letter")
              check_text(zh_readme, "zh", "README.md")
              check_text(en_readme, "en", "README.en.md")
              require(zh_readme != en_readme, "The two README files must differ")

              surfaces = declared_surfaces(manifest)
              commands = (manifest.get("contributes") or {}).get("commands") or []
              entry = resolve_entry_command(pkg_dir, manifest)

              def run_case(case):
                  layout, capabilities, locale = case
                  with TemporaryDirectory(prefix="block-poop-i18n-") as temp:
                      return (layout, locale), run_plugin(
                          entry, pkg_dir, locale, layout, capabilities, Path(temp), surfaces, commands, actions=(layout == "full")
                      )

              cases = [
                  (layout, capabilities, locale)
                  for layout, capabilities in LAYOUTS.items()
                  for locale in ("zh", "en")
              ]
              with ThreadPoolExecutor(max_workers=len(cases)) as pool:
                  pages_by_case = dict(pool.map(run_case, cases))
              for layout in LAYOUTS:
                  for surface in surfaces:
                      require(
                          pages_by_case[(layout, "zh")][surface]["title"]
                          != pages_by_case[(layout, "en")][surface]["title"],
                          f"{layout} {surface}: Chinese and English page titles must differ",
                      )
                      require(
                          pages_by_case[(layout, "zh")][surface] != pages_by_case[(layout, "en")][surface],
                          f"{layout} {surface}: Chinese and English rendered pages must differ",
                      )
              print("Bilingual release gate passed on staged dist package.")

          repo = os.environ["REPO"]
          event = os.environ["EVENT_NAME"]
          ref_name = os.environ["REF_NAME"]
          force = os.environ.get("FORCE") == "true"
          shanghai = datetime.timezone(datetime.timedelta(hours=8))

          def sh(*args):
              return subprocess.check_output(args, text=True).strip()

          def summary(msg):
              print(msg)
              s_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if s_path:
                  with open(s_path, "a", encoding="utf-8") as f:
                      f.write(msg + "\n")

          def set_output(**kwargs):
              o_path = os.environ.get("GITHUB_OUTPUT")
              if o_path:
                  with open(o_path, "a", encoding="utf-8") as f:
                      for k, v in kwargs.items():
                          f.write(f"{k}={v}\n")

          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          assert manifest.get("app") == "blockmd", "manifest.app must be 'blockmd'"
          plugin_id = manifest["id"].strip()
          assert re.match(r"^[a-z0-9][a-z0-9-]{1,47}$", plugin_id), f"invalid id: {plugin_id}"
          base_ver = manifest["version"].strip()
          m_base = re.match(r"^(\d+)\.(\d+)\.(\d+)$", base_ver)
          assert m_base, f"manifest.version must be X.Y.Z, got {base_ver}"
          base_major, base_minor = int(m_base.group(1)), int(m_base.group(2))
          plugin_title = (manifest.get("name", {}).get("en") or plugin_id).strip()

          head_sha = sh("git", "rev-parse", "HEAD")

          def parse_ver(tag):
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", (tag or "").strip())
              return (int(m.group(1)), int(m.group(2)), int(m.group(3))) if m else None

          releases = []
          page_num = 1
          while True:
              page = json.loads(sh("gh", "api", f"repos/{repo}/releases?per_page=100&page={page_num}"))
              if not page:
                  break
              releases.extend(page)
              if len(page) < 100:
                  break
              page_num += 1
          stable = [r for r in releases if not r.get("draft") and not r.get("prerelease") and parse_ver(r.get("tag_name"))]
          stable.sort(key=lambda r: parse_ver(r["tag_name"]))
          previous = stable[-1] if stable else None

          taken = {parse_ver(r.get("tag_name")) for r in releases if parse_ver(r.get("tag_name"))}
          for t in sh("git", "tag", "--list", "v*").splitlines():
              pv = parse_ver(t)
              if pv:
                  taken.add(pv)

          def resolve_tag_sha(rel):
              if not rel:
                  return ""
              tag = rel["tag_name"]
              try:
                  s = sh("git", "rev-parse", f"{tag}^{{commit}}")
                  if re.match(r"^[0-9a-f]{40}$", s):
                      return s
              except Exception:
                  pass
              try:
                  s = sh("gh", "api", f"repos/{repo}/commits/{tag}", "--jq", ".sha")
                  if re.match(r"^[0-9a-f]{40}$", s):
                      return s
              except Exception:
                  pass
              return ""

          if event == "push" and ref_name.startswith("v"):
              pv = parse_ver(ref_name)
              assert pv, f"Tag {ref_name} must match vX.Y.Z"
              version = f"{pv[0]}.{pv[1]}.{pv[2]}"
              tag = f"v{version}"
              prev_for_notes = next((r for r in reversed(stable) if r["tag_name"] != tag), None)
              prev_sha = resolve_tag_sha(prev_for_notes)
          else:
              if event == "schedule" and not force and previous and previous.get("published_at"):
                  today = datetime.datetime.now(shanghai).strftime("%Y-%m-%d")
                  pub_dt = datetime.datetime.fromisoformat(previous["published_at"].replace("Z", "+00:00")).astimezone(shanghai)
                  if today == pub_dt.strftime("%Y-%m-%d"):
                      summary(f"今日（{today}）已发布过 {previous['tag_name']}，每日定时最多自动发布一次，本次跳过。")
                      set_output(should_release="no")
                      sys.exit(0)

              prev_sha = resolve_tag_sha(previous)
              if prev_sha and prev_sha == head_sha and not force:
                  summary(f"当前 HEAD ({head_sha[:7]}) 与最新 Release {previous['tag_name']} 一致，跳过发版。")
                  set_output(should_release="no")
                  sys.exit(0)

              if prev_sha and not force:
                  is_anc = subprocess.call(["git", "merge-base", "--is-ancestor", prev_sha, head_sha]) == 0
                  if is_anc:
                      changed = [
                          p for p in sh("git", "diff", "--name-only", prev_sha, head_sha).splitlines()
                          if p and not p.startswith(".github/") and p not in {".gitignore", "LICENSE"}
                      ]
                      if not changed:
                          summary(f"自 {previous['tag_name']} 以来仅包含 CI 或仓库元数据变更，无需发包，本次跳过。")
                          set_output(should_release="no")
                          sys.exit(0)
                      subjects = sh("git", "log", "--no-merges", "--format=%s", f"{prev_sha}..{head_sha}").splitlines()
                      if subjects and all("[skip release]" in s.lower() for s in subjects):
                          summary("区间内提交均标记 [skip release]，本次跳过。")
                          set_output(should_release="no")
                          sys.exit(0)

              commit_count = int(sh("git", "rev-list", "--count", head_sha))
              cand = (base_major, base_minor, commit_count)
              highest = max(taken) if taken else None
              if highest and cand <= highest:
                  cand = (highest[0], highest[1], highest[2] + 1)
              while cand in taken:
                  cand = (cand[0], cand[1], cand[2] + 1)
              version = f"{cand[0]}.{cand[1]}.{cand[2]}"
              tag = f"v{version}"

          notes_lines = []
          if prev_sha and prev_sha != head_sha and subprocess.call(["git", "merge-base", "--is-ancestor", prev_sha, head_sha]) == 0:
              raw_log = sh("git", "log", "--no-merges", "--reverse", "--format=%h%x00%s", f"{prev_sha}..{head_sha}")
              for line in raw_log.splitlines():
                  if not line.strip():
                      continue
                  c_sha, subj = line.split("\x00", 1)
                  if re.match(r"^(?:ci|docs)(?:\([^)]*\))?:\s", subj, re.I):
                      continue
                  notes_lines.append(f"- {subj} (`{c_sha}`)")
          if not notes_lines:
              notes_lines.append(f"- Automated release from `{head_sha[:7]}`.")
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("## Changes\n\n" + "\n".join(notes_lines) + "\n")

          pkg_dir = os.path.join("dist", plugin_id)
          shutil.rmtree("dist", ignore_errors=True)
          os.makedirs(pkg_dir, exist_ok=True)
          tar_bytes = subprocess.check_output(["git", "archive", "--format=tar", head_sha])
          subprocess.run(["tar", "-xf", "-", "-C", pkg_dir], input=tar_bytes, check=True)
          shutil.rmtree(os.path.join(pkg_dir, ".github"), ignore_errors=True)
          for meta_file in (".gitignore",):
              p = os.path.join(pkg_dir, meta_file)
              if not os.path.islink(p) and os.path.exists(p):
                  os.remove(p)

          try:
              check_no_symlinks_tree(Path(pkg_dir))
          except Exception as exc:
              print(f"Bilingual release gate failed: {exc}", file=sys.stderr)
              sys.exit(1)

          manifest["version"] = version
          with open(os.path.join(pkg_dir, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")

          try:
              validate_staged_package(Path(pkg_dir))
          except Exception as exc:
              print(f"Bilingual release gate failed: {exc}", file=sys.stderr)
              sys.exit(1)

          archive_name = f"{plugin_id}-{tag}.tar.gz"
          subprocess.check_call(["tar", "-czf", archive_name, "-C", "dist", plugin_id])

          summary(f"准备发布 {plugin_title} {tag} (archive={archive_name}, commit={head_sha[:7]})")
          set_output(
              should_release="yes",
              version=version,
              tag=tag,
              title=f"{plugin_title} {version}",
              archive=archive_name,
              head_sha=head_sha,
          )
          PY

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          ARCHIVE: ${{ steps.plan.outputs.archive }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Release ${TAG} already exists. Never overwrite a published archive (SHA-256 immutability); bump version instead." >&2
            exit 1
          else
            gh release create "${TAG}" "${ARCHIVE}" \
              --target "${HEAD_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
