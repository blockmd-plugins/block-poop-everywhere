          def validate_staged_package(pkg_dir):
              check_no_symlinks_tree(pkg_dir)
              for py_path in sorted(pkg_dir.rglob("*.py")):
                  if py_path.is_file():
                      compile(py_path.read_bytes(), str(py_path), "exec")

              # Regression: split_md_lines stays O(N) on large LF-only files.
              import importlib.util, time as _time
              _spec = importlib.util.spec_from_file_location("_poop_perf_check", str(pkg_dir / "main.py"))
              _mod = importlib.util.module_from_spec(_spec)
              _spec.loader.exec_module(_mod)
              _t0 = _time.perf_counter()
              _big_lines = _mod.split_md_lines("hello line\n" * 160_000)
              _dt = _time.perf_counter() - _t0
              require(len(_big_lines) == 160_000 and _dt < 2.0, f"split_md_lines performance regression: {_dt:.2f}s")

              # Regression: CommonMark v1.0.9 edge cases (nested refdef lazy cont, bq-list HTML close,
              # inline link title protection, legacy v1.0.2 list wrap flush, nested bq wrap safety, O(N) bq refdefs).
              _p = _mod.PoopEverywherePlugin()
              _sig = "<!-- block-poop-everywhere:drop -->"
              require(_p.count_markers(f"> > [r]: /u\n> example {_sig}\n") == 0, "nested refdef lazy cont must be protected")
              require(_p.count_markers(f"> - <div>\n> drop {_sig}\n") == 1, "bq-list HTML block must close on dedent")
              require(_p.count_markers(f'> [x](/url "caption\n> example {_sig}\n> tail")\n') == 0, "inline link title must be protected")
              _lw3 = f"> [poop:wrap-start] cap {_sig}\n> - A\n> [poop:wrap-end] ··· {_sig}\n\n"
              require(_p.count_markers(_lw3) == 2, "legacy v1.0.2 list wrap count mismatch")
              _lw3_out, _lw3_rem = _p.strip_markers(_lw3)
              require(_lw3_rem == 2 and _lw3_out == "> - A\n", f"legacy v1.0.2 list wrap flush mismatch: {_lw3_out!r}, {_lw3_rem}")
              require(not _p.is_editor_wrap_safe("> > A\n> B"), "nested lazy bq depth drop must be refused")
              _t1 = _time.perf_counter()
              require(_p.count_markers("> [x]: /url\n" * 2000) == 0, "bq refdef batch count mismatch")
              require(_time.perf_counter() - _t1 < 1.0, "bq refdef parsing regressed to O(N^2)")

              manifest_path = pkg_dir / "manifest.json"
              require(not os.path.islink(manifest_path) and manifest_path.is_file(), "Staged package missing manifest.json")
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              plugin_id = manifest.get("id")
              require(isinstance(plugin_id, str) and plugin_id.strip(), "Missing manifest.id")
              require(plugin_id.strip() != "block-diagnostics", "Reserved plugin id: block-diagnostics")

              for field in ("name", "summary"):
                  translations = manifest.get(field)
                  require(isinstance(translations, dict), f"manifest.{field} must be an object")
                  for locale in ("zh", "en"):
                      value = translations.get(locale)
                      require(isinstance(value, str) and value.strip(), f"Missing manifest.{field}.{locale}")
                      if locale == "en":
                          require(not CHINESE.search(value), f"manifest.{field}.en: Chinese text in {value!r}")
              check_text(manifest, "zh", "manifest")
              check_contributes_en(manifest.get("contributes"))
              check_contributes_en(manifest.get("permission_reasons"), "manifest.permission_reasons")

              zh_readme = read_strict_readme(pkg_dir, "README.md")
              en_readme = read_strict_readme(pkg_dir, "README.en.md")
              require(HAN.search(strip_html_comments(zh_readme)), "README.md must contain visible Chinese text")
              require(not CHINESE.search(en_readme), "README.en.md must contain English-only text")
              require(re.search(r"[A-Za-z]", strip_html_comments(en_readme)), "README.en.md must contain at least one visible ASCII letter")
              check_text(zh_readme, "zh", "README.md")
