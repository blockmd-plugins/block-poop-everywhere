          base_ver = manifest["version"].strip()
          m_base = re.match(r"^(\d+)\.(\d+)\.(\d+)$", base_ver)
          assert m_base, f"manifest.version must be X.Y.Z, got {base_ver}"
          base_major, base_minor = int(m_base.group(1)), int(m_base.group(2))
          plugin_title = (manifest.get("name", {}).get("en") or plugin_id).strip()

